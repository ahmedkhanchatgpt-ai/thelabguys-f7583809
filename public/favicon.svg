<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Vibrant diagonal gradient: magenta -> purple -> blue -> cyan -->
    <linearGradient id="labBg" x1="5%" y1="5%" x2="95%" y2="95%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- 3D spherical lighting for depth and shine -->
    <radialGradient id="sphereGlow" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="80%" stop-color="#000000" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.32" />
    </radialGradient>

    <!-- Soft edge highlight -->
    <linearGradient id="edgeRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.25" />
    </linearGradient>

    <!-- Subtle shadow for crisp text contrast -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.75" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Circular badge with 100% transparent canvas outside (no black bars/boxes) -->
  <circle cx="32" cy="32" r="30" fill="url(#labBg)" />
  <circle cx="32" cy="32" r="30" fill="url(#sphereGlow)" />
  <circle cx="32" cy="32" r="29.25" stroke="url(#edgeRing)" stroke-width="1.5" fill="none" />

  <!-- Bold, centered LAB lettering -->
  <text 
    x="32" 
    y="33.5" 
    text-anchor="middle" 
    dominant-baseline="central" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Space Grotesk', 'Inter', sans-serif" 
    font-weight="900" 
    font-size="20" 
    letter-spacing="0.5" 
    fill="#ffffff"
    filter="url(#shadow)"
  >LAB</text>
</svg>
