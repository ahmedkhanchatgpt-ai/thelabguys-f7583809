<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Lab Guys | Redirecting...</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Single Page Application redirect for static hosts (GitHub Pages, etc.)
      (function() {
        var pathSegmentsToKeep = 0;
        var l = window.location;
        var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
        var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/?p=/' + encodeURIComponent(path) + (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') + l.hash;
        window.location.replace(target);
      })();
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #09090b;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .loader {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(168, 85, 247, 0.2);
        border-top-color: #a855f7;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .box {
        text-align: center;
      }
      p {
        color: #a1a1aa;
        font-size: 14px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="loader"></div>
      <p>Redirecting to The Lab Guys...</p>
    </div>
  </body>
</html>
